```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para ti ♡</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px 18px;

            font-family: Georgia, "Times New Roman", serif;

            background:
                radial-gradient(
                    circle at top left,
                    #fff9f6 0%,
                    transparent 38%
                ),
                radial-gradient(
                    circle at bottom right,
                    #eee0d9 0%,
                    transparent 42%
                ),
                #f8f0eb;

            color: #403532;
        }

        .card {
            width: 100%;
            max-width: 440px;

            background: rgba(255, 252, 250, 0.96);

            padding: 42px 28px 35px;

            border-radius: 28px;

            box-shadow:
                0 18px 50px rgba(75, 50, 40, 0.12);

            text-align: center;

            animation: appear 1s ease;
        }

        .tiny-heart {
            font-size: 18px;

            color: #a98578;

            margin-bottom: 18px;
        }

        .for-you {
            font-family: Arial, sans-serif;

            font-size: 11px;

            letter-spacing: 4px;

            text-transform: uppercase;

            color: #a58a80;

            margin-bottom: 18px;
        }

        h1 {
            margin: 0;

            font-size: 31px;

            font-weight: normal;

            letter-spacing: -0.5px;
        }

        .artist {
            margin-top: 8px;

            font-family: Arial, sans-serif;

            font-size: 13px;

            color: #9a8580;
        }

        .message {
            margin: 32px auto 25px;

            max-width: 340px;

            font-size: 20px;

            line-height: 1.65;
        }

        .divider {
            width: 45px;

            height: 1px;

            background: #d9c5bc;

            margin: 28px auto;
        }

        /* Spotify */

        .spotify-player {
            width: 100%;

            border: none;

            border-radius: 12px;

            display: block;
        }

        .spotify-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            margin-top: 18px;

            padding: 13px 22px;

            border-radius: 30px;

            background: #1db954;

            color: white;

            text-decoration: none;

            font-family: Arial, sans-serif;

            font-size: 14px;

            font-weight: 600;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .spotify-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 7px 18px rgba(29, 185, 84, 0.25);
        }

        .spotify-icon {
            font-size: 17px;
        }

        /* Final text */

        .ending {
            margin-top: 38px;

            padding-top: 30px;

            border-top: 1px solid #eaded8;

            font-size: 15px;

            line-height: 1.9;

            color: #806e68;

            font-style: italic;
        }

        .ending span {
            display: block;

            margin-top: 15px;

            font-size: 18px;

            color: #a98578;
        }

        .footer-heart {
            margin-top: 25px;

            font-size: 18px;

            color: #a98578;
        }

        @keyframes appear {
            from {
                opacity: 0;

                transform: translateY(18px);
            }

            to {
                opacity: 1;

                transform: translateY(0);
            }
        }

        @media (max-width: 400px) {

            .card {
                padding: 35px 20px 30px;
            }

            h1 {
                font-size: 28px;
            }

            .message {
                font-size: 18px;
            }
        }
    </style>
</head>


<body>

    <main class="card">

        <div class="tiny-heart">
            ♡
        </div>

        <div class="for-you">
            Para ti
        </div>


        <h1>
            Accidentally in Love
        </h1>


        <div class="artist">
            Counting Crows
        </div>


        <div class="message">
            Porque enamorarme de ti fue de las cosas más bonitas.
        </div>


        <div class="divider"></div>


        <!-- REPRODUCTOR DE SPOTIFY -->

        <iframe
            class="spotify-player"

            src="https://open.spotify.com/embed/track/7FQSD5JjWqGtS1BaQQiT6V?utm_source=generator&theme=0"

            height="152"

            frameborder="0"

            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"

            loading="lazy">
        </iframe>


        <!-- BOTÓN PARA ABRIR SPOTIFY -->

        <a
            class="spotify-button"

            href="https://open.spotify.com/track/7FQSD5JjWqGtS1BaQQiT6V"

            target="_blank"

            rel="noopener noreferrer">

            <span class="spotify-icon">
                ♫
            </span>

            Abrir en Spotify

        </a>


        <!-- MENSAJE FINAL -->

        <div class="ending">

            “I surrender to the strawberry ice cream...”

            <span>
                ♡
            </span>

        </div>


        <div class="footer-heart">
            ♡
        </div>

    </main>

</body>

</html>
```
